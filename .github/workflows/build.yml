# Builds the library on every push and pull request.
#
# This repo is the dependency of VillagersPlus, so a red build here means VillagersPlus cannot be
# built either.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # Java 21 is the floor: options.release = 21 and both loader manifests require it.
        java: [21]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle

      - name: make gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --stacktrace

      - name: capture build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
